<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo List</title>
  <link rel="stylesheet" href="style.css">

  <!-- Syntax highlighting -->
  <!-- <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js">
  </script> -->
</head>

<body>
  <header class="page-header">
    <h1>Demo List</h1>
    <p>Explore interactive UI effects and animations.</p>
  </header>

  <main class="container">
    <section class="demo-toolbar">

    <!-- Search -->
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="demo-search"
            placeholder="Search demos..."
            autocomplete="off"
        >

        <button id="clear-search" type="button" aria-label="Clear search">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Category Filter -->
    <div class="category-filters" id="category-filters">
        <!-- Categories generated by JavaScript -->
    </div>

    <!-- Result Count -->
    <p class="result-count" id="result-count"></p>

</section>

<!-- Empty State -->
<div class="empty-state" id="empty-state" hidden>
    <i class="fa-solid fa-magnifying-glass"></i>
    <h3>No demos found</h3>
    <p>Try another keyword or select a different category.</p>
</div>
    <div id="demo-container"></div>
  </main>

  <!-- Code Modal -->
  <dialog id="code-modal" class="code-modal">

    <div class="modal-header">
      <div>
        <h2 id="modal-title">Source Code</h2>
        <p id="modal-path"></p>
      </div>

      <button id="close-modal" class="close-modal" aria-label="Close">
        &times;
      </button>
    </div>

    <div class="modal-toolbar">

      <div class="code-tabs">
        <button class="tab active" data-file="html">HTML</button>
        <button class="tab" data-file="css">CSS</button>
        <button class="tab" data-file="js">JavaScript</button>
      </div>

      <button id="copy-code" class="copy-button">
        Copy Code
      </button>

    </div>

    <div class="code-content">
      <div id="loading" class="loading">Loading source code...</div>

      <pre id="code-container" hidden><code id="code-display"></code></pre>
    </div>

  </dialog>

  <script src="demos.config.js"></script>
  <script src="script.js"></script>
  <script src="search.js"></script>
</body>

</html>
